<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            border:2px solid black;
            display:grid;
            grid-template-columns:repeat(4,1fr);
        }
        .dv1{
            grid-column:1/3;
            background-color: aqua;
        }
        .dv2{
            grid-column:3/5;
            background-color: rgb(58, 16, 142);
        }
        .dv3{
            grid-row:2/4;
            background-color: brown;
        }
        .dv4{
            grid-column:2/4;
            background-color: blue;
        }
        .dv5{
            grid-column:2/4;
            background-color: greenyellow;
        }
        .dv6{
            grid-row:2/4;
            background-color: yellow;
            grid-column:4;
        }
        .dv7{
            grid-column:1/4;
            background-color:orangered;
        }
        .dv8{
            grid-column:4;
            background-color:indianred;
        }



    </style>

</head>
<body>
    <div class="div1">
    <div class="dv1">binnu</div>
    <div class="dv2">2</div>
    <div class="dv3">3</div>
    <div class="dv4">4</div>
    <div class="dv5">5</div>
    <div class="dv6">6</div>
    <div class="dv7">7</div>
    <div class="dv8">8</div>
</div>
</body>
</html>
