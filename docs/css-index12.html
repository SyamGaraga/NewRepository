<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function enter9(){
            console.log("Hello")
            var inputDomElement = document.getElementById("dv1");
            console.log(inputDomElement.innerText)
            inputDomElement.innerText = 9;
        }
    </script>
    <style>
        .div1{
            border:2px solid black;
            width:440px;
            border-radius:25px;
            display: grid;
            background-color: rgb(104, 111, 111);

        }
        .dv1{
            border:2px solid black;
            height:150px;
            background-color: aliceblue;
            border-radius: 25px;
            padding: 10px;
            display: flex;
            justify-content: end;
            align-items: end;

    
        }
        .div2{
            display: grid;
            grid-template-columns:repeat(5,1fr);
            padding:10px;
            row-gap: 2px;
    
            
        }
        .div2 div{
            display:flex;
            border:2px solid black;
            background-color: rgb(183, 193, 190);
            border-radius: 10px;
            height:40px;
            width:70px;
    
            justify-content: center;
            align-items: center;
    
        }
        .div2 div:hover{
            background-color: rgb(67, 181, 181);
        }
    </style>
</head>
<body>
    <h1><strong><u>Developed caluculator UI using Grid:</u></strong></h1>
    <div class="div1">
        <div class="dv1"  style="color:rgb(2, 4, 27)"><strong id="dv1">365+365</strong></div>
        <div class="buttons">
        <div class="div2">
        <div class="dv2">AC</div>
        <div class="dv3">%</div>
        <div class="dv4">(</div>
        <div class="dv5">)</div>
        <div class="dv6">X</div>
        <div class="dv7" onclick="enter9()">9</div>
        <div class="dv8">8</div>
        <div class="dv9">7</div>
        <div class="dv10">6</div>
        <div class="dv2">+</div>
        <div class="dv3">5</div>
        <div class="dv4">4</div>
        <div class="dv5">3</div>
        <div class="dv6">2</div>
        <div class="dv7">x</div>
        <div class="dv8">1</div>
        <div class="dv9">0</div>
        <div class="dv10">.</div>
        <div class="dv10">-</div>
        <div class="dv11">=</div>
        </div>
    </div>
    </div>

</body>
</html>
