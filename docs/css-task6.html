<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            border:7px solid red;
            height:100px;
            width:100px;
            position:relative;

        }
        #div2{
            border: 7px solid blue;
            height:100px;
            width:100px;
            position: relative;
            left: 100px;

        }
        #div3{
            border: 7px solid rgb(47, 255, 0);
            height:100px;
            width:100px;
            position: relative;


        }
        #div4{
            border: 7px solid black;
            height:100px;
            width:100px;
            position: relative;
            left: 100px;
        
        }
    </style>
</head>
<body>
    <div id="div1"></div>
    <div id="div2"></div>
    <div id="div3"></div>
    <div id="div4"></div>
    
</body>
</html>
