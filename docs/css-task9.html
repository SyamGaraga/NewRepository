<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #md{
            border:1px solid black;
            padding:15px;
            width:270px;
            border-radius:20px;
            flex-wrap: wrap;
        }
        #div1,#div2,#div3{
            border: 2px solid black;
            display:flex;
            gap:20px;
            width:250px;
            margin-bottom:20px;
            padding:10px;
            flex-wrap:wrap;
            justify-content:space-evenly;
            border-radius:20px;
        }
        #div1 div{
            display:flex;
            border:2px solid black;
            padding:20px;
            background-color: aqua;flex-wrap:wrap;
            border-radius: 10px;
            flex-wrap: wrap;
            justify-content:space-evenly;
            
            
            
        }
        #div2 div{
            display: flex;
            border:2px solid black;
            padding:20px;
            background-color: rgb(51, 65, 61);
            border-radius:10px;
            flex-wrap: wrap;
            justify-content:space-evenly;
            height:50px;
        }
        #div3 div{
            display: flex;
            border:2px solid black;
            padding:20px;
            background-color: blueviolet;
            border-radius: 10px;
            flex-wrap: wrap;
            justify-content:space-evenly;
            flex-grow:2;
            height:40px;
        }


    </style>
</head>
<body><div id="md">
    <div id="div1">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
    </div>
    <div id="div2">
        <div id="d1"></div>
        <div id="d2" style="flex-grow:1.5"></div>
        <div id="d3"></div>
    </div>
    <div id="div3">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
    </div></div>
    
</body>
</html>
