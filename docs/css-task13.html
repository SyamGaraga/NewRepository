<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            border: 2px solid black;
            display:grid;
            grid-template-areas: 'area1' 'area2' 'area3';

        }
        .dv1{
            background-color:black;
            grid-area: area1;
        }
        .dv2{
            background-color: brown;
            grid-area: area2;
        }
        .dv3{

            background-color: rgb(42, 48, 165);
            grid-area: area3;
        }
        .dv4{
            
            background-color: rgb(163, 124, 124);
            grid-area: area4;
        }
        .dv5{
            background-color: rgb(134, 165, 42);
            grid-area: area5;
        }
        .dv6{
            
            background-color: rgb(208, 10, 10);
            grid-area:area6;
        }
       

    </style>
</head>
<body>
    <div class="div1">
        <div class="dv1">1</div>
        <div class="dv2">2</div>
        <div class="dv3">3</div>
        <div class="dv4">4</div>
        <div class="dv5">5</div>
        <div class="dv6">6</div>
    </div>
</body>
</html>
