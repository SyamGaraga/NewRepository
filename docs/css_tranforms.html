<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .controls label {
            display: block;
            margin: 5px 0;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <label><input type="radio" name="transform" onclick="applyTransform('none')"> transform: none;</label>
            <label><input type="radio" name="transform" onclick="applyTransform('rotate(10deg)')"> transform: rotate(10deg);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('rotate(45deg)')"> transform: rotate(45deg);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('translate(20px, 10px)')"> transform: translate(20px, 10px);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('scale(2, 2)')"> transform: scale(2, 2);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('skewX(20deg)')"> transform: skewX(20deg);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('skewY(20deg)')"> transform: skewY(20deg);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('skewX(60deg)')"> transform: skewX(60deg);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('skewY(60deg)')"> transform: skewY(60deg);</label>
            <label><input type="radio" name="transform" onclick="applyTransform('scaleY(1.5)')"> transform: scaleY(20deg);</label>
        </div>
        <div class="box" id="box">DIV</div>
    </div>

    <script>
        function applyTransform(transformValue) {
            const box = document.getElementById('box');
            box.style.transform = transformValue;
        }
    </script>
</body>
</html>
